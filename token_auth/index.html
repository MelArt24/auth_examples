<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Auth0 Token Authentication</title>

    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>

<body>

<main id="main-holder">

    <h1>
        Auth0 Authentication
    </h1>

    <div id="guest-container">

        <section>

            <h2>
                Login
            </h2>

            <div
                    id="login-message"
                    class="message"
            ></div>

            <a href="/login">Login with Auth0</a>

        </section>

        <hr>

        <section>

            <h2>
                Create Auth0 User
            </h2>

            <div
                    id="register-message"
                    class="message"
            ></div>

            <form id="register-form">

                <input
                        type="email"
                        name="email"
                        placeholder="Email"
                        required
                >

                <input
                        type="password"
                        name="password"
                        placeholder="Password"
                        required
                >

                <button type="submit">
                    Create user
                </button>

            </form>

        </section>

    </div>

    <div
            id="user-container"
            style="display: none;"
    >

        <h2>
            Login successful
        </h2>

        <p>
            <strong>User:</strong>
            <span id="username"></span>
        </p>

        <p>
            <strong>Refresh token:</strong>
            <span id="refresh-enabled"></span>
        </p>

        <p>
            <strong>Remaining token lifetime:</strong>
            <span id="remaining-seconds">
                -
            </span>
            seconds
        </p>

        <p>
            <strong>Last refresh:</strong>
            <span id="refresh-status">
                not checked
            </span>
        </p>

        <p>
            <strong>Access Token:</strong>
        </p>

        <div id="access-token"></div>

        <button id="check-token-button">
            Check token lifetime
        </button>

        <button id="logout-button">
            Logout
        </button>

    </div>

</main>


<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        min-height: 100%;
        margin: 0;
    }

    body {
        min-height: 100vh;

        padding: 30px;

        display: flex;

        align-items: center;
        justify-content: center;

        background-color: #3a3a3a;

        font-family:
                Arial,
                Helvetica,
                sans-serif;
    }

    #main-holder {
        width: 550px;

        max-width: 95%;

        padding: 35px;

        background-color: white;

        border-radius: 8px;

        box-shadow:
                0 0 10px
                rgba(0, 0, 0, 0.5);
    }

    h1,
    h2 {
        text-align: center;
    }

    hr {
        margin:
                35px
                0;
    }

    form {
        display: flex;

        flex-direction: column;

        gap: 12px;
    }

    input {
        padding: 12px;

        border:
                1px
                solid
                #aaa;

        border-radius: 5px;

        font-size: 16px;
    }

    button {
        padding: 12px;

        margin-top: 8px;

        border: none;

        border-radius: 5px;

        background-color: #333;

        color: white;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;
    }

    button:hover {
        background-color: #555;
    }

    .message {
        display: none;

        padding: 10px;

        margin-bottom: 15px;

        border-radius: 5px;
    }

    .message.error {
        display: block;

        color: #8a0000;

        background-color: #e58f8f;

        border:
                1px
                solid
                #8a0000;
    }

    .message.success {
        display: block;

        color: #155724;

        background-color: #d4edda;

        border:
                1px
                solid
                #155724;
    }

    #user-container {
        text-align: left;
    }

    #access-token {
        padding: 10px;

        margin-bottom: 20px;

        max-height: 170px;

        overflow-y: auto;

        overflow-wrap: anywhere;

        border-radius: 5px;

        background-color: #eee;

        font-family: monospace;

        font-size: 12px;
    }

    #check-token-button,
    #logout-button {
        width: 100%;
    }

</style>


<script>

    const SESSION_STORAGE_KEY =
        'auth0-session';

    const guestContainer =
        document.getElementById(
            'guest-container'
        );

    const userContainer =
        document.getElementById(
            'user-container'
        );

    const registerForm =
        document.getElementById(
            'register-form'
        );

    const loginMessage =
        document.getElementById(
            'login-message'
        );

    const registerMessage =
        document.getElementById(
            'register-message'
        );

    const usernameElement =
        document.getElementById(
            'username'
        );

    const refreshEnabledElement =
        document.getElementById(
            'refresh-enabled'
        );

    const remainingSecondsElement =
        document.getElementById(
            'remaining-seconds'
        );

    const refreshStatusElement =
        document.getElementById(
            'refresh-status'
        );

    const accessTokenElement =
        document.getElementById(
            'access-token'
        );

    const checkTokenButton =
        document.getElementById(
            'check-token-button'
        );

    const logoutButton =
        document.getElementById(
            'logout-button'
        );

    function getSession() {

        const raw =
            sessionStorage.getItem(
                SESSION_STORAGE_KEY
            );

        if (!raw) {
            return null;
        }

        try {
            return JSON.parse(raw);
        } catch {
            return null;
        }
    }


    function saveSession(session) {

        sessionStorage.setItem(
            SESSION_STORAGE_KEY,
            JSON.stringify(session)
        );
    }


    function removeSession() {

        sessionStorage.removeItem(
            SESSION_STORAGE_KEY
        );
    }

    function showMessage(
        element,
        message,
        type
    ) {

        element.textContent =
            message;

        element.className =
            `message ${type}`;
    }


    function clearMessage(element) {

        element.textContent = '';

        element.className =
            'message';
    }

    function showGuest() {

        guestContainer.style.display =
            'block';

        userContainer.style.display =
            'none';
    }


    function showUser(session) {

        guestContainer.style.display =
            'none';

        userContainer.style.display =
            'block';

        usernameElement.textContent =
            session.username;

        refreshEnabledElement.textContent =
            session.refreshEnabled
                ? 'available'
                : 'not returned';

        accessTokenElement.textContent =
            session.token;

        if (
            session.remainingSeconds !==
            undefined
        ) {
            remainingSecondsElement.textContent =
                session.remainingSeconds;
        }
    }

    function updateSessionFromResponse(
        response
    ) {

        const session =
            getSession();

        if (!session) {
            return null;
        }

        const responseToken =
            response.data?.token;

        const headerToken =
            response.headers[
                'x-new-access-token'
                ];

        const newToken =
            responseToken ||
            headerToken;

        if (
            newToken &&
            newToken !== session.token
        ) {
            console.log(
                'Browser received new access token'
            );

            session.token =
                newToken;
        }

        if (
            response.data
                ?.remainingSeconds !==
            undefined
        ) {
            session.remainingSeconds =
                response.data
                    .remainingSeconds;
        }

        saveSession(session);

        return session;
    }

    registerForm.addEventListener(
        'submit',
        async event => {

            event.preventDefault();

            clearMessage(
                registerMessage
            );

            const email =
                registerForm.email
                    .value
                    .trim();

            const password =
                registerForm.password
                    .value;

            try {

                const response =
                    await axios.post(
                        '/api/register',
                        {
                            email,
                            password
                        }
                    );

                showMessage(
                    registerMessage,
                    response.data.message,
                    'success'
                );

                registerForm.reset();

            } catch (error) {

                const message =
                    error.response
                        ?.data
                        ?.message ||
                    'Unable to create user';

                showMessage(
                    registerMessage,
                    message,
                    'error'
                );
            }
        }
    );

    checkTokenButton.addEventListener(
        'click',
        async () => {

            const session =
                getSession();

            if (!session?.token) {
                return;
            }

            try {

                const response =
                    await axios.get(
                        '/api/token-status',
                        {
                            headers: {
                                Authorization:
                                    `Bearer ${session.token}`
                            }
                        }
                    );

                const updatedSession =
                    updateSessionFromResponse(
                        response
                    );

                accessTokenElement.textContent =
                    updatedSession.token;

                remainingSecondsElement.textContent =
                    response.data
                        .remainingSeconds;

                if (
                    response.data.refreshed
                ) {
                    refreshStatusElement.textContent =
                        'token automatically refreshed';
                } else {
                    refreshStatusElement.textContent =
                        'token is still valid';
                }

            } catch (error) {

                removeSession();

                showGuest();

                showMessage(
                    loginMessage,
                    'Session expired. Please log in again.',
                    'error'
                );
            }
        }
    );

    logoutButton.addEventListener(
        'click',
        async () => {

            const session =
                getSession();

            try {

                if (session?.token) {

                    await axios.post(
                        '/api/logout',
                        {},
                        {
                            headers: {
                                Authorization:
                                    `Bearer ${session.token}`
                            }
                        }
                    );
                }

            } catch (error) {

                console.error(
                    'Logout error:',
                    error
                );

            } finally {

                removeSession();

                showGuest();
            }
        }
    );

    async function restoreSession() {

        const session =
            getSession();

        if (!session?.token) {
            showGuest();
            return;
        }

        try {

            const response =
                await axios.get(
                    '/api/me',
                    {
                        headers: {
                            Authorization:
                                `Bearer ${session.token}`
                        }
                    }
                );

            const updatedSession =
                updateSessionFromResponse(
                    response
                );

            updatedSession.username =
                response.data.username;

            saveSession(
                updatedSession
            );

            showUser(
                updatedSession
            );

            if (
                response.data.refreshed
            ) {
                refreshStatusElement.textContent =
                    'token automatically refreshed';
            }

        } catch {

            removeSession();

            showGuest();
        }
    }


    restoreSession();

</script>

</body>

</html>
